services:

  postgresql:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgresql-data:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.24
    depends_on:
      - postgresql
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgresql
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8081:8080"

  api:
    build: .
    command: uvicorn feedspeechback.api.main:app --host 0.0.0.0 --port 8000
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      - temporal
    ports:
      - "8001:8000"
    restart: on-failure

  worker-default:
    build: .
    command: python -m feedspeechback.workers.default
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      - temporal
    restart: on-failure

  worker-transcription:
    build: .
    command: python -m feedspeechback.workers.transcription
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-whisperx}
    depends_on:
      - temporal
    restart: on-failure

  worker-diarization:
    build: .
    command: python -m feedspeechback.workers.diarization
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      - temporal
    restart: on-failure

volumes:
  postgresql-data:
