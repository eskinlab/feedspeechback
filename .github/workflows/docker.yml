name: build-job-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag"
        default: "0.1"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The job image is ~10 GB; reclaim runner disk that would otherwise run out
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/feedspeechback-job:${{ inputs.tag }}
