[project]
name = "feedspeechback"
version = "0.1.0"
description = "AI speech feedback - Nebius serverless MVP"
requires-python = ">=3.12,<3.14"
# cli.py needs only boto3. The heavy job deps live in the "job" group,
# installed only inside the Docker image (uv sync --only-group job).
dependencies = [
    "boto3>=1.34",
]

[dependency-groups]
job = [
    "whisperx>=3.1",
    "openai>=1.60",
]
