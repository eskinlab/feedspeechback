[project]
name = "feedspeechback"
version = "0.1.0"
description = "AI speech evaluation platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "pydantic>=2.0",
    "temporalio>=1.30.0",
    "uvicorn[standard]>=0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feedspeechback"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle+pyflakes, I: import sorting, B: bugbear footguns,
# UP: keep syntax modern. Pedantic tiers (D, ANN, ...) deliberately off.
select = ["E", "F", "I", "B", "UP"]
